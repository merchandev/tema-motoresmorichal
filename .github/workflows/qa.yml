name: Theme QA

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: theme-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run qa
      - name: Verify committed dist/ matches the build
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::dist/ is out of date. Run npm run build and commit dist/."
            exit 1
          fi

  php-syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: node scripts/php-lint.mjs

  package:
    needs: [frontend, php-syntax]
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: '315532800'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - run: npm ci
      - run: npm run package
      - name: Verify SHA-256 checksum
        run: sha256sum -c *.sha256
        working-directory: release
      - name: Verify ZIP integrity
        run: unzip -t *.zip
        working-directory: release
      - name: Stage the theme folder for WordPress
        id: installable
        run: |
          mkdir -p release/installable
          unzip -q release/*.zip -d release/installable
          test -f release/installable/toyota-monagas/style.css
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # GitHub always wraps an artifact in its own ZIP. Uploading the extracted
      # theme folder makes that download a theme ZIP WordPress installs as is.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toyota-monagas-${{ steps.installable.outputs.version }}-wordpress
          path: release/installable/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-toyota-monagas-${{ github.sha }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
